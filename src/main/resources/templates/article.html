<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title}">Article Title</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <a href="/" class="nav-logo">Felipe Gardin</a>
                <div class="nav-links">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/about" class="nav-link">About</a>
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                        <svg class="sun-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
                        </svg>
                        <svg class="moon-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="main">
        <div class="container article-container">
            <div class="article-shell">
                <article class="article-full">
                    <header class="article-header article-header-card">
                        <p class="article-breadcrumb">Home / Article</p>
                        <h1 class="article-title-full" th:text="${article.title}">Article Title</h1>
                        <div class="article-meta article-meta-enhanced">
                            <time class="article-date" th:text="${#temporals.format(article.createdAt, 'MMMM dd, yyyy')}">January 1, 2024</time>
                            <span class="article-divider">•</span>
                            <span>Deep Dive</span>
                            <span class="article-updated" th:if="${article.updatedAt != article.createdAt}">
                                <span class="article-divider">•</span>
                                Updated: <span th:text="${#temporals.format(article.updatedAt, 'MMMM dd, yyyy')}">January 1, 2024</span>
                            </span>
                        </div>
                        <div class="article-tags" th:if="${article.tags != null and !article.tags.empty}">
                            <span th:each="tag : ${article.tags}" class="article-tag" th:text="${tag}">Tag</span>
                        </div>
                    </header>

                    <div class="article-body article-body-prose" th:utext="${article.content}">
                        Article content goes here...
                    </div>
                </article>

                <div class="article-navigation article-navigation-card">
                    <a href="/" class="back-link">← Back to Articles</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Software Engineering Blog. Built with Spring Boot and Thymeleaf.</p>
        </div>
    </footer>
</body>
</html>
